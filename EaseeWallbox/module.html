<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
        font-family: 'Poppins', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    .ew {
        --c: #95a5a6;
        --line: rgba(127,127,127,.18);
        --muted: rgba(127,127,127,.95);
        height: 100vh;
        padding: 52px clamp(14px, 3vw, 40px) clamp(12px, 2vh, 24px);
        display: grid;
        grid-template-rows: auto 1fr;
        gap: clamp(8px, 2vh, 20px);
        overflow: hidden;
    }

    /* ---------- Kopfzeile ---------- */
    .ew-head { display: flex; align-items: center; gap: 10px; }
    .ew-status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .2px; }
    .ew-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 22%, transparent); }
    .ew.charging .ew-dot { animation: pulse 1.6s ease-in-out infinite; }
    .ew-updated { margin-left: auto; font-size: 11px; color: var(--muted); }

    /* ---------- Hauptbereich ---------- */
    .ew-main {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        align-items: center;
        gap: clamp(16px, 4vw, 64px);
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
    }

    /* Leistungsring */
    .ew-gauge { display: flex; flex-direction: column; align-items: center; min-height: 0; }
    .ew-ring { position: relative; width: min(100%, 54vh, 460px); aspect-ratio: 1; }
    .ew-ring svg { width: 100%; height: 100%; transform: rotate(135deg); overflow: visible; }
    .ew-track { stroke: var(--line); }
    .ew-arc { stroke: var(--c); transition: stroke-dashoffset .9s cubic-bezier(.3,.7,.3,1), stroke .4s; }
    .ew-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ew-kw { font-size: clamp(26px, 8.5vmin, 72px); font-weight: 600; line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
    .ew-kwunit { font-size: clamp(11px, 2vmin, 16px); color: var(--muted); margin-top: 6px; letter-spacing: .5px; }
    .ew-max { font-size: clamp(10px, 1.6vmin, 14px); color: var(--muted); opacity: .75; margin-top: 4px; }

    /* Werteliste */
    .ew-panel { display: flex; flex-direction: column; min-width: 0; }
    .ew-row { display: flex; align-items: center; gap: 12px; padding: clamp(8px, 1.6vh, 14px) 0; border-bottom: 1px solid var(--line); min-width: 0; }
    .ew-row:first-child { border-top: 1px solid var(--line); }
    .ew-ico { width: clamp(16px, 2.2vmin, 22px); height: clamp(16px, 2.2vmin, 22px); flex: none; stroke: currentColor; fill: none; stroke-width: 1.7;
              stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
    .ew-label { font-size: clamp(12px, 1.8vmin, 17px); color: var(--muted); white-space: nowrap; }
    .ew-value { margin-left: auto; text-align: right; font-size: clamp(14px, 2.2vmin, 22px); font-weight: 600;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    .ew-value small { font-weight: 400; color: var(--muted); font-size: .85em; margin-left: 6px; }
    .ew-row.sched { display: none; }
    .ew-row.sched.on { display: flex; }
    .ew-row.sched .ew-value { font-weight: 500; font-size: clamp(12px, 1.8vmin, 15px); white-space: normal; }

    /* Stromgrenze */
    .ew-stepper { margin-left: auto; display: flex; align-items: center; gap: 4px; }
    .ew-step { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent;
               color: inherit; font-size: 17px; line-height: 1; cursor: pointer; }
    .ew-step:hover:not(:disabled) { background: rgba(127,127,127,.12); }
    .ew-step:disabled { opacity: .3; cursor: default; }
    .ew-limit { min-width: 58px; text-align: center; font-weight: 600; font-size: clamp(14px, 2.1vmin, 18px); font-variant-numeric: tabular-nums; }

    /* Hauptknopf */
    .ew-action {
        margin-top: clamp(12px, 2.4vh, 24px);
        border: 0; border-radius: 10px; padding: clamp(11px, 1.8vh, 16px);
        font: inherit; font-weight: 600; font-size: clamp(13px, 1.9vmin, 16px); letter-spacing: .3px;
        cursor: pointer; color: #fff; transition: filter .2s, transform .1s;
    }
    .ew-action:hover:not(:disabled) { filter: brightness(1.08); }
    .ew-action:active:not(:disabled) { transform: scale(.99); }
    .ew-action:disabled { opacity: .35; cursor: default; }
    .ew-action.start { background: #27ae60; }
    .ew-action.stop { background: #d35400; }


    /* Illustration Wallbox + Fahrzeug */
    .ew-scene { width: 100%; max-height: min(30vh, 240px); margin-bottom: clamp(8px, 2vh, 20px); }
    .ew-scene .box { fill: rgba(127,127,127,.16); stroke: rgba(127,127,127,.45); stroke-width: 1.2; }
    .ew-scene .led { fill: var(--c); filter: drop-shadow(0 0 3px var(--c)); transition: fill .4s; }
    .ew.charging .ew-scene .led { animation: blink 1.6s ease-in-out infinite; }
    .ew-scene .cable { fill: none; stroke: rgba(127,127,127,.5); stroke-width: 2.6; stroke-linecap: round; }
    .ew-scene .flow { fill: none; stroke: var(--c); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 2 9; opacity: 0; }
    .ew.charging .ew-scene .flow { opacity: 1; animation: flow .6s linear infinite; filter: drop-shadow(0 0 2px var(--c)); }
    .ew-scene .car { fill: rgba(127,127,127,.2); stroke: rgba(127,127,127,.6); stroke-width: 1.3; }
    .ew-scene .glass { fill: rgba(127,127,127,.16); }
    .ew-scene .wheel { fill: rgba(30,30,30,.85); stroke: rgba(127,127,127,.65); stroke-width: 1.8; }
    .ew-scene .batt-frame { fill: none; stroke: rgba(127,127,127,.6); stroke-width: 1.1; }
    .ew-scene .batt { fill: var(--c); opacity: 0; transform-origin: 90px 68px; }
    .ew.charging .ew-scene .batt { opacity: 1; animation: fill 2.6s ease-in-out infinite; }
    .ew.empty .ew-scene .car-g, .ew.empty .ew-scene .cable-g { opacity: .15; transition: opacity .4s; }

    @keyframes blink { 50% { opacity: .35; } }
    @keyframes flow { to { stroke-dashoffset: -11; } }
    @keyframes fill { 0% { transform: scaleX(.25); } 70%, 100% { transform: scaleX(1); } }

    @keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--c) 0%, transparent); } }

    /* ---------- Schmale / kleine Kacheln ---------- */
    @media (max-width: 640px) {
        .ew-main { grid-template-columns: 1fr; align-content: center; gap: 12px; }
        .ew-ring { width: min(62vw, 34vh, 260px); }
    }
    @media (max-width: 640px) and (max-height: 760px) {
        .ew-scene { display: none; }
    }
    @media (max-width: 640px) and (max-height: 520px) {
        .ew-row.opt { display: none; }
    }
    @media (max-width: 640px) and (max-height: 380px) {
        .ew-row { display: none; }
        .ew-row.limit { display: flex; }
        .ew-max, .ew-updated { display: none; }
        .ew-action { margin-top: 8px; }
    }
    @media (max-height: 460px) {
        .ew-scene { display: none; }
    }
    @media (max-height: 260px) {
        .ew-panel { display: none; }
        .ew-main { grid-template-columns: 1fr; }
        .ew-ring { width: min(60vw, 52vh); }
    }
</style>

<div class="ew" id="root">
    <div class="ew-head">
        <span class="ew-status"><span class="ew-dot"></span><span id="status">–</span></span>
        <span class="ew-updated" id="updated"></span>
    </div>

    <div class="ew-main">
        <div class="ew-gauge">
            <div class="ew-ring">
                <svg viewBox="0 0 120 120">
                    <!-- 270°-Bogen: Umfang 2π·52 = 326,7 → 3/4 = 245 -->
                    <circle class="ew-track" cx="60" cy="60" r="52" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="245 327"/>
                    <circle class="ew-arc" id="arc" cx="60" cy="60" r="52" fill="none" stroke-width="7" stroke-linecap="round"
                            stroke-dasharray="245 327" stroke-dashoffset="245"/>
                </svg>
                <div class="ew-center">
                    <div class="ew-kw" id="power">–</div>
                    <div class="ew-kwunit">kW</div>
                    <div class="ew-max">von <span id="maxkw">11</span> kW</div>
                </div>
            </div>
        </div>

        <div class="ew-panel">
            <svg class="ew-scene" viewBox="0 0 145 100" aria-hidden="true">
                <rect class="box" x="6" y="14" width="30" height="46" rx="9"/>
                <rect class="led" x="19" y="22" width="4" height="22" rx="2"/>
                <g class="cable-g">
                    <path class="cable" d="M21 60 C 21 92, 70 94, 96 70"/>
                    <path class="flow" d="M21 60 C 21 92, 70 94, 96 70"/>
                </g>
                <g class="car-g">
                    <path class="car" d="M60 70 L64 58 Q67 49 76 48 L104 47 Q113 47 119 55 L126 62 Q139 64 140 72 L140 78 Q140 81 137 81 L63 81 Q60 81 60 78 Z"/>
                    <path class="glass" d="M70 57 Q72 52 78 51.5 L90 51 L90 59 L69 59 Z"/>
                    <path class="glass" d="M94 51 L104 50.5 Q110 50.5 114 55 L117 59 L94 59 Z"/>
                    <circle class="wheel" cx="78" cy="81" r="8"/>
                    <circle class="wheel" cx="123" cy="81" r="8"/>
                    <rect class="batt-frame" x="88" y="64" width="26" height="9" rx="2"/>
                    <rect class="batt" x="90" y="66" width="22" height="5" rx="1"/>
                </g>
            </svg>

            <div class="ew-row">
                <svg class="ew-ico" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
                <span class="ew-label">Aktuelle Ladung</span>
                <span class="ew-value"><span id="sessionE">–</span> kWh<small id="sessionC"></small></span>
            </div>
            <div class="ew-row opt">
                <svg class="ew-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <span class="ew-label">Heute</span>
                <span class="ew-value"><span id="todayE">–</span> kWh<small id="todayC"></small></span>
            </div>
            <div class="ew-row opt">
                <svg class="ew-ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                <span class="ew-label">Dieser Monat</span>
                <span class="ew-value"><span id="monthE">–</span> kWh<small id="monthC"></small></span>
            </div>
            <div class="ew-row opt">
                <svg class="ew-ico" viewBox="0 0 24 24"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/></svg>
                <span class="ew-label">Anschluss</span>
                <span class="ew-value" id="conn">–</span>
            </div>
            <div class="ew-row limit">
                <svg class="ew-ico" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
                <span class="ew-label">Stromgrenze</span>
                <span class="ew-stepper">
                    <button class="ew-step" id="minus" onclick="changeLimit(-1)" aria-label="weniger">−</button>
                    <span class="ew-limit" id="limit">–</span>
                    <button class="ew-step" id="plus" onclick="changeLimit(1)" aria-label="mehr">+</button>
                </span>
            </div>
            <div class="ew-row sched" id="schedRow">
                <svg class="ew-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                <span class="ew-label">Zeitsteuerung</span>
                <span class="ew-value" id="schedule"></span>
            </div>

            <button class="ew-action start" id="toggle" onclick="toggleCharging()">–</button>
        </div>
    </div>
</div>

<script>
    let state = null;
    const $ = (id) => document.getElementById(id);

    function handleMessage(data) {
        state = JSON.parse(data);

        const root = $('root');
        root.style.setProperty('--c', state.color);
        root.classList.toggle('charging', state.charging);
        root.classList.toggle('empty', !state.connected);

        $('status').textContent = state.status;
        $('updated').textContent = 'Stand ' + state.updated + (state.ok ? '' : ' · keine Verbindung');
        $('power').textContent = state.power;
        $('maxkw').textContent = state.maxKW;

        $('sessionE').textContent = state.sessionE;
        $('sessionC').textContent = state.sessionC + ' €';
        $('todayE').textContent = state.todayE;
        $('todayC').textContent = state.todayC + ' €';
        $('monthE').textContent = state.monthE;
        $('monthC').textContent = state.monthC + ' €';

        if (state.phases > 0) {
            $('conn').innerHTML = state.phases + '-phasig<small>' + state.current + ' A</small>';
        } else {
            $('conn').textContent = state.connected ? 'Fahrzeug verbunden' : 'Kein Fahrzeug';
        }

        $('schedRow').classList.toggle('on', !!state.schedule);
        $('schedule').textContent = state.schedule || '';

        // Bogen: 245 = leer, 0 = voll
        $('arc').setAttribute('stroke-dashoffset', (245 * (1 - state.percent / 100)).toFixed(1));

        showLimit(state.limit);

        const toggle = $('toggle');
        toggle.textContent = state.charging ? 'Laden pausieren' : 'Laden starten';
        toggle.className = 'ew-action ' + (state.charging ? 'stop' : 'start');
        toggle.disabled = !state.connected;
    }

    // Easee meldet ohne Begrenzung den Hardware-Maximalwert (z. B. 32 A) → "max"
    function showLimit(value) {
        const isMax = value >= state.limitMax;
        $('limit').textContent = value <= 0 ? '–' : (isMax ? 'max' : value + ' A');
        $('minus').disabled = value > 0 && value <= 6;
        $('plus').disabled = isMax;
    }

    function toggleCharging() {
        if (!state) return;
        $('toggle').disabled = true;
        requestAction('ChargingActive', !state.charging);
    }

    // Mehrere Klicks sammeln und erst nach kurzer Pause senden
    let limitTimer = null;

    function changeLimit(step) {
        if (!state || state.limit <= 0) return;
        const value = Math.max(6, Math.min(state.limitMax, Math.min(state.limit, state.limitMax) + step));
        state.limit = value;
        showLimit(value);

        clearTimeout(limitTimer);
        limitTimer = setTimeout(() => requestAction('ChargeLimit', value), 1000);
    }
</script>
