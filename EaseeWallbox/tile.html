<style>
    /* ===== Hausstil cfaf2002 · Kachel-Grundlage v1 (siehe STYLEGUIDE.md) =====
       Farbschema 0 = Symcon-Design (Farben der Visualisierung), 1 = Dunkel, 2 = Hell.
       Modulspezifisch ist nur --brand (Akzent der festen Farbschemas). */
    :root {
        --brand: #2e86de;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --fg: var(--content-color, #eef3f7);
        --accent: var(--accent-color, var(--brand));
        --on-accent: #ffffff;
        --muted: color-mix(in srgb, var(--fg) 65%, transparent);
        --faint: color-mix(in srgb, var(--fg) 40%, transparent);
        --line: color-mix(in srgb, var(--fg) 15%, transparent);
        --surface: color-mix(in srgb, var(--fg) 7%, transparent);
        --surface-hover: color-mix(in srgb, var(--fg) 12%, transparent);
        --popup: var(--card-color, #232a33);
        --ok: #34b36b;
        --warn: #e2a63b;
        --bad: #e5484d;
        --info: #4b8ef0;
        --off: #8796a5;
        --radius-l: 14px;
        --radius: 12px;
        --radius-s: 8px;
        --pill: 999px;
        --gap: 8px;
    }
    html.theme-dark  { --fg: #eef3f7; --accent: var(--brand); --tile-bg: #1b2530; --popup: #232d39; }
    html.theme-light { --fg: #1d2b36; --accent: var(--brand); --tile-bg: #e9eef3; --popup: #ffffff; }
    html.theme-dark body, html.theme-light body { background: var(--tile-bg); }
    html, body { font-family: var(--font); color: var(--fg); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    /* ===== Ende Kachel-Grundlage ===== */

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    /* Farben, Schrift und Farbschemas kommen aus der Kachel-Grundlage */
    /* Bewegung sparen, solange die Kachel nicht sichtbar ist */
    body.paused *, body.paused *::before, body.paused *::after { animation-play-state: paused !important; }

    /* Hintergrundbild (optional) */
    .ew-bg { position: fixed; inset: 0; z-index: -2; background: center / cover no-repeat; display: none; }
    .ew-shade { position: fixed; inset: 0; z-index: -1; display: none;
                background: linear-gradient(180deg, rgba(0,0,0,var(--dim)) 0%, rgba(0,0,0,calc(var(--dim) + .12)) 100%); }
    body.has-bg .ew-bg, body.has-bg .ew-shade { display: block; }
    body.has-bg { color: #fff; }
    body.has-bg .ew { --line: rgba(255,255,255,.16); --muted: rgba(255,255,255,.72); }
    body.has-bg .ew-panel { background: rgba(20,22,26,.38); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
                            border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: clamp(12px, 2vh, 22px) clamp(14px, 2vw, 24px); }
    body.has-bg .ew-kw, body.has-bg .ew-status { text-shadow: 0 1px 12px rgba(0,0,0,.45); }
    body.has-bg .ew-track { stroke: rgba(255,255,255,.18); }
    body.has-bg .ew-scene .box, body.has-bg .ew-scene .car { fill: rgba(255,255,255,.12); stroke: rgba(255,255,255,.55); }
    body.has-bg .ew-scene .glass { fill: rgba(255,255,255,.14); }
    body.has-bg .ew-scene .cable { stroke: rgba(255,255,255,.5); }

    .ew {
        --c: var(--off);
        height: 100vh;
        padding: 52px clamp(14px, 3vw, 40px) clamp(12px, 2vh, 24px);
        display: grid;
        grid-template-rows: auto 1fr;
        gap: clamp(8px, 2vh, 20px);
        overflow: hidden;
    }

    /* ---------- Kopfzeile ---------- */
    .ew-head { display: flex; align-items: center; gap: 10px; }
    .ew-status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .2px; }
    .ew-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 22%, transparent); }
    .ew.charging .ew-dot { animation: pulse 1.6s ease-in-out infinite; }
    .ew-updated { margin-left: auto; font-size: 11px; color: var(--muted); }
    /* Lade-Erinnerung: Auto zu Hause, aber nicht angesteckt */
    .ew-remind { --remind: color-mix(in srgb, var(--warn) 55%, var(--bad)); display: none; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 99px; white-space: nowrap;
                 font-size: 11.5px; font-weight: 600; color: var(--on-accent); background: var(--remind); box-shadow: 0 0 0 0 color-mix(in srgb, var(--remind) 50%, transparent);
                 animation: remind 2.4s ease-out infinite; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .ew-remind.on { display: inline-flex; flex: none; }
    .ew-head { min-width: 0; }
    .ew-status { min-width: 0; }
    .ew-status #status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 460px) { .ew.remind .ew-updated { display: none; } }
    @media (max-width: 340px) { .ew.remind .ew-status #status { display: none; } }
    .ew-remind svg { width: 13px; height: 13px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes remind { 70% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--remind) 0%, transparent); } 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--remind) 0%, transparent); } }

    /* ---------- Hauptbereich ---------- */
    .ew-main {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        align-items: center;
        gap: clamp(16px, 4vw, 64px);
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
    }

    /* Leistungsring */
    .ew-gauge { display: flex; flex-direction: column; align-items: center; min-height: 0; }
    .ew-ring { position: relative; width: min(100%, 54vh, 460px); aspect-ratio: 1; }
    .ew-ring svg { width: 100%; height: 100%; transform: rotate(135deg); overflow: visible; }
    .ew-track { stroke: var(--line); }
    .ew-arc { stroke: var(--c); transition: stroke-dashoffset .9s cubic-bezier(.3,.7,.3,1), stroke .4s; }
    .ew-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ew-kw { font-size: clamp(26px, 8.5vmin, 72px); font-weight: 600; line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
    .ew-kwunit { font-size: clamp(11px, 2vmin, 16px); color: var(--muted); margin-top: 6px; letter-spacing: .5px; }
    .ew-max { font-size: clamp(10px, 1.6vmin, 14px); color: var(--muted); opacity: .75; margin-top: 4px; }

    /* Werteliste */
    .ew-panel { display: flex; flex-direction: column; min-width: 0; }
    .ew-row { display: flex; align-items: center; gap: 12px; padding: clamp(8px, 1.6vh, 14px) 0; border-bottom: 1px solid var(--line); min-width: 0; }
    .ew-row:first-child { border-top: 1px solid var(--line); }
    .ew-ico { width: clamp(16px, 2.2vmin, 22px); height: clamp(16px, 2.2vmin, 22px); flex: none; stroke: currentColor; fill: none; stroke-width: 1.7;
              stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
    .ew-label { font-size: clamp(12px, 1.8vmin, 17px); color: var(--muted); white-space: nowrap; }
    .ew-value { margin-left: auto; text-align: right; font-size: clamp(14px, 2.2vmin, 22px); font-weight: 600;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    .ew-value small { font-weight: 400; color: var(--muted); font-size: .85em; margin-left: 6px; }
    .ew-row.sched { display: none; }
    .ew-row.sched.on { display: flex; }
    .ew-row.sched .ew-value { font-weight: 500; font-size: clamp(12px, 1.8vmin, 15px); white-space: normal; }

    /* Akkustand */
    .ew-row.soc { display: none; }
    .ew.has-soc .ew-row.soc { display: flex; }
    .ew-socbar { position: relative; flex: 1; min-width: 40px; max-width: 220px; height: 8px; margin-left: auto;
                 border-radius: 99px; background: var(--line); overflow: hidden; }
    .ew-socbar span { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; transition: width .8s ease;
                      background: linear-gradient(90deg, #1fa35a, #5ee08f); box-shadow: 0 0 8px rgba(94,224,143,.35); }
    .ew-socbar span.mid { background: linear-gradient(90deg, #e6900f, #ffc861); box-shadow: 0 0 8px rgba(255,200,97,.35); }
    .ew-socbar span.low { background: linear-gradient(90deg, #d63a2a, #ff7b6b); box-shadow: 0 0 8px rgba(255,123,107,.35); }
    .ew-socbar i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: currentColor; opacity: .6; display: none; }
    .ew-socval { margin-left: 10px; min-width: 52px; }

    /* Mit Akku-Zeile wird es enger: Grafik früher ausblenden */
    @media (max-height: 680px) { .ew.has-soc .ew-scene { display: none; } }

    /* Stromgrenze */
    .ew-stepper { margin-left: auto; display: flex; align-items: center; gap: 4px; }
    .ew-step { width: 36px; height: 36px; border-radius: var(--radius-s); border: 1px solid var(--line); background: transparent;
               color: inherit; font-size: 17px; line-height: 1; cursor: pointer; }
    .ew-step:hover:not(:disabled) { background: var(--surface-hover); }
    /* Akzentfarbe des Designs für Bedienelemente ohne Statusbedeutung */
    .ew-step:not(:disabled) { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    body.has-bg .ew-step:not(:disabled) { color: #fff; border-color: rgba(255,255,255,.35); }
    .ew-step:disabled { opacity: .3; cursor: default; }
    .ew-limit { min-width: 58px; text-align: center; font-weight: 600; font-size: clamp(14px, 2.1vmin, 18px); font-variant-numeric: tabular-nums; }

    /* Hauptknopf */
    .ew-action {
        margin-top: clamp(12px, 2.4vh, 24px);
        border: 0; border-radius: 10px; padding: clamp(11px, 1.8vh, 16px);
        font: inherit; font-weight: 600; font-size: clamp(13px, 1.9vmin, 16px); letter-spacing: .3px;
        min-height: 36px; cursor: pointer; color: var(--on-accent); transition: filter .2s, transform .1s;
    }
    .ew-action:hover:not(:disabled) { filter: brightness(1.08); }
    .ew-action:active:not(:disabled) { transform: scale(.99); }
    .ew-action:disabled { opacity: .35; cursor: default; }
    /* Zustandsfarben der Kachel-Grundlage: Starten grün, Pausieren orange */
    .ew-action.start { background: var(--ok); }
    .ew-action.stop { background: color-mix(in srgb, var(--warn) 55%, var(--bad)); }


    /* Illustration Wallbox + Fahrzeug */
    .ew-scene { width: 100%; max-height: min(30vh, 240px); margin-bottom: clamp(8px, 2vh, 20px); }
    .ew-scene .box { fill: rgba(127,127,127,.16); stroke: rgba(127,127,127,.45); stroke-width: 1.2; }
    .ew-scene .led { fill: var(--c); filter: drop-shadow(0 0 3px var(--c)); transition: fill .4s; }
    /* Beim Laden: Lichtstreifen füllt sich von unten nach oben und startet dann wieder unten */
    .ew-scene .led-fill, .ew-scene .led-head { display: none; }
    .ew.charging .ew-scene .led { opacity: .22; filter: none; }
    .ew.charging .ew-scene .led-fill { display: block; fill: var(--c); filter: drop-shadow(0 0 3px var(--c));
                                       transform-box: view-box; transform-origin: 21px 44px; animation: ledfill 2.4s ease-in infinite; }
    .ew.charging .ew-scene .led-head { display: block; fill: #fff; filter: drop-shadow(0 0 2.5px var(--c));
                                       animation: ledhead 2.4s ease-in infinite; }
    .ew-scene .cable { fill: none; stroke: rgba(127,127,127,.5); stroke-width: 2.6; stroke-linecap: round; }
    .ew-scene .flow { fill: none; stroke: var(--c); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 2 9; opacity: 0; }
    .ew.charging .ew-scene .flow { opacity: 1; animation: flow .6s linear infinite; filter: drop-shadow(0 0 2px var(--c)); }
    .ew-scene .car { fill: rgba(127,127,127,.2); stroke: rgba(127,127,127,.6); stroke-width: 1.3; }
    .ew-scene .glass { fill: rgba(127,127,127,.16); }
    .ew-scene .wheel { fill: rgba(30,30,30,.85); stroke: rgba(127,127,127,.65); stroke-width: 1.8; }
    /* Akku-Kapsel: Glas-Hülle, Füllung mit Farbverlauf je nach Akkustand, Lichtreflex beim Laden */
    #battG { --b1: #5ee08f; --b2: #1fa35a; }
    #battG.mid { --b1: #ffc861; --b2: #e6900f; }
    #battG.low { --b1: #ff7b6b; --b2: #d63a2a; }
    #battG.none { display: none; }
    .ew-scene .batt-shell { fill: rgba(16,18,22,.72); stroke: rgba(255,255,255,.22); stroke-width: .6; }
    .ew-scene .batt-tip { fill: rgba(255,255,255,.35); }
    .ew-scene .b1 { stop-color: var(--b1); }
    .ew-scene .b2 { stop-color: var(--b2); }
    .ew-scene .batt { opacity: .95; transition: width .8s ease; transform-box: fill-box; transform-origin: left center; }
    #battG.anim .batt { animation: fill 2.6s ease-in-out infinite; }
    .ew-scene .batt-gloss { fill: rgba(255,255,255,.16); }
    .ew-scene .batt-shine { opacity: 0; }
    .ew.charging .ew-scene .batt-shine { opacity: 1; animation: shine 2.2s ease-in-out infinite; }
    .ew-scene .batt-bolt { fill: #fff; opacity: 0; transition: opacity .3s; }
    .ew.charging .ew-scene .batt-bolt { opacity: 1; }
    .ew-scene .batt-txt { font-size: 6.6px; font-weight: 700; fill: #fff; letter-spacing: .1px;
                          paint-order: stroke; stroke: rgba(0,0,0,.35); stroke-width: .8px; }
    .ew-scene .batt-glow { fill: var(--b1); opacity: 0; filter: blur(3px); }
    .ew.charging .ew-scene .batt-glow { opacity: .35; animation: blink 2.2s ease-in-out infinite; }
    .ew-scene .plug { fill: rgba(127,127,127,.8); }
    .ew.charging .ew-scene .plug { fill: var(--c); filter: drop-shadow(0 0 2px var(--c)); }
    .ew.empty .ew-scene .car-g, .ew.empty .ew-scene .cable-g { opacity: .15; transition: opacity .4s; }

    @keyframes blink { 50% { opacity: .35; } }
    @keyframes flow { to { stroke-dashoffset: -11; } }
    @keyframes ledfill { 0% { transform: scaleY(0); opacity: 1; } 80% { transform: scaleY(1); opacity: 1; }
                         92% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
    @keyframes ledhead { 0% { transform: translateY(20px); opacity: .9; } 80% { transform: translateY(0); opacity: .9; }
                         92%, 100% { transform: translateY(0); opacity: 0; } }
    @keyframes shine { 0% { transform: translateX(-14px); } 60%, 100% { transform: translateX(48px); } }
    @keyframes fill { 0% { transform: scaleX(.25); } 70%, 100% { transform: scaleX(1); } }

    @keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--c) 0%, transparent); } }

    /* ---------- Schmale / kleine Kacheln ---------- */
    @media (max-width: 640px) {
        /* Schmal und hoch (Tablet hochkant): Ring nimmt nur den Platz, den die Werteliste übrig lässt */
        .ew-main { display: flex; flex-direction: column; justify-content: center; gap: 12px; height: 100%; }
        .ew-gauge { flex: 1 1 0; min-height: 120px; max-height: 280px; justify-content: center; }
        .ew-ring { width: auto; height: 100%; max-width: 100%; }
        .ew-kw { font-size: clamp(24px, 7vmin, 44px); }
        .ew-panel { flex: none; width: 100%; align-self: stretch; }
        .ew-scene { max-height: min(22vh, 190px); }
    }
    @media (max-width: 640px) and (max-height: 760px) {
        .ew-scene { display: none; }
    }
    @media (max-width: 640px) and (max-height: 520px) {
        .ew-row.opt { display: none; }
    }
    @media (max-width: 640px) and (max-height: 380px) {
        .ew-row { display: none; }
        .ew-row.limit { display: flex; }
        .ew-max, .ew-updated { display: none; }
        .ew-action { margin-top: 8px; }
    }
    @media (max-height: 460px) {
        .ew-scene { display: none; }
    }
    @media (max-height: 260px) {
        .ew-panel { display: none; }
        .ew-main { grid-template-columns: 1fr; }
        .ew-ring { width: min(60vw, 52vh); }
    }

    /* Flache Kacheln (z. B. Handy): Ring links, wichtigste Werte + Knopf rechts */
    @media (max-height: 300px) and (min-width: 280px) {
        .ew { padding-top: 44px; padding-bottom: 10px; gap: 6px; }
        /* Raster statt der Hochkant-Anordnung schmaler Kacheln */
        .ew-main { display: grid; height: auto; grid-template-columns: auto minmax(0, 1fr); gap: clamp(10px, 4vw, 28px); align-items: center; }
        .ew-gauge { flex: none; min-height: 0; max-height: none; }
        .ew-ring { width: min(38vw, calc(100vh - 70px)); height: auto; }
        .ew-kw { font-size: clamp(20px, 11vh, 34px); }
        .ew-kwunit { font-size: 11px; margin-top: 2px; }
        .ew-max, .ew-updated, .ew-scene { display: none; }
        .ew-panel { display: flex; }
        body.has-bg .ew-panel { padding: 6px 12px 10px; border-radius: 12px; }
        .ew-row, .ew-row.limit, .ew-row.sched.on { display: none; }
        .ew-row.session, .ew-row.today { display: flex; padding: 6px 0; gap: 8px; }
        .ew-row.session { border-top: 0; }
        .ew-row.today { border-bottom: 0; }
        .ew.has-soc .ew-row.soc { display: flex; padding: 6px 0; gap: 8px; border-top: 0; }
        .ew.has-soc .ew-row.today { display: none; }
        .ew.has-soc .ew-row.session { border-bottom: 0; }
        .ew-socbar { display: none; }
        .ew-socval { margin-left: auto; min-width: 0; }
        .ew-ico { width: 15px; height: 15px; }
        .ew-label { font-size: 12px; }
        .ew-value { font-size: 14px; }
        .ew-value small { display: none; }
        .ew-action { margin-top: 6px; padding: 8px 10px; font-size: 13px; border-radius: 9px; }
    }
    /* Sehr flach (2×1 auf dem Handy): nur ein Wert über dem Knopf */
    @media (max-height: 190px) and (min-width: 280px) {
        .ew-row.today { display: none !important; }
        .ew.has-soc .ew-row.session { display: none !important; }
        .ew-row.session, .ew.has-soc .ew-row.soc { padding: 4px 0; border: 0; }
    }
</style>

<div class="ew-bg" id="bg"></div>
<div class="ew-shade" id="shade"></div>
<div class="ew" id="root">
    <div class="ew-head">
        <span class="ew-status"><span class="ew-dot"></span><span id="status">–</span></span>
        <span class="ew-remind" id="remind" title="Das Auto steht zu Hause, ist aber nicht an der Wallbox angesteckt">
            <svg viewBox="0 0 24 24"><path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0zM12 17v5"/></svg><span>Bitte anstecken</span>
        </span>
        <span class="ew-updated" id="updated"></span>
    </div>

    <div class="ew-main">
        <div class="ew-gauge">
            <div class="ew-ring">
                <svg viewBox="0 0 120 120">
                    <!-- 270°-Bogen: Umfang 2π·52 = 326,7 → 3/4 = 245 -->
                    <circle class="ew-track" cx="60" cy="60" r="52" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="245 327"/>
                    <circle class="ew-arc" id="arc" cx="60" cy="60" r="52" fill="none" stroke-width="7" stroke-linecap="round"
                            stroke-dasharray="245 327" stroke-dashoffset="245"/>
                </svg>
                <div class="ew-center">
                    <div class="ew-kw" id="power">–</div>
                    <div class="ew-kwunit">kW</div>
                    <div class="ew-max">von <span id="maxkw">11</span> kW</div>
                </div>
            </div>
        </div>

        <div class="ew-panel">
            <svg class="ew-scene" viewBox="0 0 145 100" aria-hidden="true">
                <rect class="box" x="6" y="14" width="30" height="46" rx="9"/>
                <rect class="led" x="19" y="22" width="4" height="22" rx="2"/>
                <rect class="led-fill" x="19" y="22" width="4" height="22" rx="2"/>
                <rect class="led-head" x="19.4" y="22.2" width="3.2" height="2.2" rx="1.1"/>
                <g class="car-g">
                    <!-- eingebautes Auto-Symbol -->
                    <g id="carBuiltin">
                        <path class="car" d="M60 70 L64 58 Q67 49 76 48 L104 47 Q113 47 119 55 L126 62 Q139 64 140 72 L140 78 Q140 81 137 81 L63 81 Q60 81 60 78 Z"/>
                        <path class="glass" d="M70 57 Q72 52 78 51.5 L90 51 L90 59 L69 59 Z"/>
                        <path class="glass" d="M94 51 L104 50.5 Q110 50.5 114 55 L117 59 L94 59 Z"/>
                        <circle class="wheel" cx="78" cy="81" r="8"/>
                        <circle class="wheel" cx="123" cy="81" r="8"/>
                    </g>
                    <!-- eigenes Fahrzeugbild (aus der Instanz) -->
                    <image id="carImg" x="50" y="22" width="93" height="66" preserveAspectRatio="xMidYMax meet" style="display:none"/>
                </g>
                <!-- Kabel von der Wallbox zum Ladeanschluss, Strom fließt animiert -->
                <g class="cable-g">
                    <path class="cable" id="cable" d="M21 60 C 21 90, 33 88, 63 66"/>
                    <path class="flow" id="flow" d="M21 60 C 21 90, 33 88, 63 66"/>
                    <circle class="plug" id="plug" cx="63" cy="66" r="2.2"/>
                </g>
                <!-- Akku mit Ladefortschritt -->
                <g id="battG" class="none" transform="translate(80 31)">
                    <defs>
                        <linearGradient id="battGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop class="b2" offset="0"/><stop class="b1" offset="1"/>
                        </linearGradient>
                        <linearGradient id="battShine" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0" stop-color="#fff" stop-opacity="0"/>
                            <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
                            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
                        </linearGradient>
                        <clipPath id="battClip"><rect x="1.2" y="1.2" width="35.6" height="10.6" rx="5.3"/></clipPath>
                    </defs>
                    <rect class="batt-glow" id="battGlow" x="1" y="1" width="36" height="11" rx="5.5"/>
                    <rect class="batt-shell" x="0" y="0" width="38" height="13" rx="6.5"/>
                    <rect class="batt-tip" x="38.6" y="4.4" width="1.6" height="4.2" rx=".8"/>
                    <g clip-path="url(#battClip)">
                        <rect class="batt" id="batt" x="1.2" y="1.2" width="35.6" height="10.6" fill="url(#battGrad)"/>
                        <rect class="batt-gloss" x="1.2" y="1.2" width="35.6" height="4"/>
                        <rect class="batt-shine" x="0" y="0" width="12" height="13" fill="url(#battShine)"/>
                    </g>
                    <path class="batt-bolt" d="M7.4 2.6 L4.6 7.1 L6.8 7.1 L6 10.4 L9 5.8 L6.8 5.8 Z"/>
                    <text class="batt-txt" id="battTxt" x="21" y="8.9" text-anchor="middle"></text>
                </g>
            </svg>

            <div class="ew-row soc" id="socRow">
                <svg class="ew-ico" viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2"/></svg>
                <span class="ew-label">Akku</span>
                <span class="ew-socbar"><span id="socFill"></span><i id="socMark"></i></span>
                <span class="ew-value ew-socval"><span id="socVal">–</span><small id="socTarget"></small></span>
            </div>
            <div class="ew-row session">
                <svg class="ew-ico" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
                <span class="ew-label">Ladung</span>
                <span class="ew-value"><span id="sessionE">–</span> kWh<small id="sessionC"></small></span>
            </div>
            <div class="ew-row opt today">
                <svg class="ew-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <span class="ew-label">Heute</span>
                <span class="ew-value"><span id="todayE">–</span> kWh<small id="todayC"></small></span>
            </div>
            <div class="ew-row opt">
                <svg class="ew-ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                <span class="ew-label">Dieser Monat</span>
                <span class="ew-value"><span id="monthE">–</span> kWh<small id="monthC"></small></span>
            </div>
            <div class="ew-row opt">
                <svg class="ew-ico" viewBox="0 0 24 24"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/></svg>
                <span class="ew-label">Anschluss</span>
                <span class="ew-value" id="conn">–</span>
            </div>
            <div class="ew-row limit">
                <svg class="ew-ico" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
                <span class="ew-label">Stromgrenze</span>
                <span class="ew-stepper">
                    <button class="ew-step" id="minus" onclick="changeLimit(-1)" aria-label="weniger">−</button>
                    <span class="ew-limit" id="limit">–</span>
                    <button class="ew-step" id="plus" onclick="changeLimit(1)" aria-label="mehr">+</button>
                </span>
            </div>
            <div class="ew-row sched" id="schedRow">
                <svg class="ew-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                <span class="ew-label">Zeitsteuerung</span>
                <span class="ew-value" id="schedule"></span>
            </div>

            <button class="ew-action start" id="toggle" onclick="toggleCharging()">–</button>
        </div>
    </div>
</div>

<script>
    // Hausstil: Farbschema der Kachel (0 = Symcon-Design, 1 = Dunkel, 2 = Hell)
    function applyTheme(theme) {
        var root = document.documentElement;
        root.classList.toggle('theme-dark', theme === 1);
        root.classList.toggle('theme-light', theme === 2);
    }

    let state = null;
    const $ = (id) => document.getElementById(id);

    /** Wert mit kleinem Zusatz setzen – nur als Text, nie als HTML */
    function setValue(el, main, small) {
        el.textContent = main;
        if (small) {
            const s = document.createElement('small');
            s.textContent = small;
            el.appendChild(s);
        }
    }

    // Animationen anhalten, solange die Kachel nicht zu sehen ist
    document.addEventListener('visibilitychange', () => document.body.classList.toggle('paused', document.hidden));

    function handleMessage(data) {
        state = JSON.parse(data);

        // Hintergrund kommt nur beim Laden der Kachel bzw. nach einer Änderung in der Instanz
        if (state.bg) {
            const has = !!state.bg.image;
            document.body.classList.toggle('has-bg', has);
            $('bg').style.backgroundImage = has ? 'url("' + state.bg.image + '")' : 'none';
            $('bg').style.filter = state.bg.blur > 0 ? 'blur(' + state.bg.blur + 'px)' : 'none';
            $('bg').style.transform = state.bg.blur > 0 ? 'scale(1.06)' : 'none';
            $('shade').style.setProperty('--dim', state.bg.dim);
        }

        if (typeof state.theme === 'number') applyTheme(state.theme);

        const root = $('root');
        root.style.setProperty('--c', /^#[0-9a-f]{6}$/i.test(state.color) ? state.color : '#8796a5');
        root.classList.toggle('charging', state.charging);
        root.classList.toggle('empty', !state.connected);

        $('status').textContent = state.status;
        $('updated').textContent = 'Stand ' + state.updated + (state.ok ? '' : ' · keine Verbindung');
        $('remind').classList.toggle('on', !!state.reminder);
        $('root').classList.toggle('remind', !!state.reminder);
        $('power').textContent = state.power;
        $('maxkw').textContent = state.maxKW;

        // Akkustand (nur wenn in der Instanz aktiviert)
        const hasSoc = state.soc !== null && state.soc !== undefined;
        root.classList.toggle('has-soc', hasSoc);
        if (hasSoc) {
            $('socVal').textContent = state.soc + ' %';
            $('socFill').style.width = state.soc + '%';
            $('socFill').classList.toggle('low', state.soc < 20);
            $('socFill').classList.toggle('mid', state.soc >= 20 && state.soc < 50);
            const t = state.socTarget;
            $('socTarget').textContent = t ? '→ ' + t + ' %' : '';
            $('socMark').style.display = t ? 'block' : 'none';
            if (t) $('socMark').style.left = 'calc(' + t + '% - 1px)';
        }
        // Fahrzeugbild/Anschluss nur beim Laden der Kachel bzw. nach Änderung in der Instanz
        if (state.car) setCar(state.car);

        // Akku im Auto-Symbol: Fortschritt (Akkustand oder Ziel), sonst Animation beim Laden
        const p = (state.progress === null || state.progress === undefined) ? null : Math.max(0, Math.min(100, state.progress));
        const charging = root.classList.contains('charging');
        const bg = $('battG');
        bg.classList.toggle('none', p === null && !charging);       // ohne Akkustand nur beim Laden zeigen
        bg.classList.toggle('anim', p === null && charging);
        bg.classList.toggle('low', p !== null && p < 20);
        bg.classList.toggle('mid', p !== null && p >= 20 && p < 50);
        $('batt').setAttribute('width', p !== null ? Math.max(1, 35.6 * p / 100).toFixed(1) : 35.6);
        $('battTxt').textContent = p !== null ? p + ' %' : '';

        $('sessionE').textContent = state.sessionE;
        $('sessionC').textContent = state.sessionC + ' €';
        $('todayE').textContent = state.todayE;
        $('todayC').textContent = state.todayC + ' €';
        $('monthE').textContent = state.monthE;
        $('monthC').textContent = state.monthC + ' €';

        if (state.phases > 0) {
            setValue($('conn'), state.phases + '-phasig', state.current + ' A');
        } else {
            $('conn').textContent = state.connected ? (state.guest ? 'Gastfahrzeug verbunden' : 'Fahrzeug verbunden') : 'Kein Fahrzeug';
        }

        $('schedRow').classList.toggle('on', !!state.schedule);
        $('schedule').textContent = state.schedule || '';

        // Bogen: 245 = leer, 0 = voll
        $('arc').setAttribute('stroke-dashoffset', (245 * (1 - state.percent / 100)).toFixed(1));

        showLimit(state.limit);

        const toggle = $('toggle');
        toggle.textContent = state.charging ? 'Laden pausieren' : 'Laden starten';
        toggle.className = 'ew-action ' + (state.charging ? 'stop' : 'start');
        toggle.disabled = !state.connected;
    }

    // Eigenes Fahrzeugbild einsetzen und Kabel an den Ladeanschluss führen
    const CAR_BOX = { x: 50, y: 22, w: 93, h: 66 };

    function setCar(car) {
        const img = $('carImg');
        const scene = document.querySelector('.ew-scene');

        if (!car.image) {
            img.style.display = 'none';
            $('carBuiltin').style.display = '';
            scene.classList.remove('photo');
            placeScene(63, 66, 80, 31);
            return;
        }

        const probe = new Image();
        probe.onload = () => {
            // Bild wird unten bündig eingepasst ("xMidYMax meet")
            const s = Math.min(CAR_BOX.w / probe.naturalWidth, CAR_BOX.h / probe.naturalHeight);
            const w = probe.naturalWidth * s, h = probe.naturalHeight * s;
            const x = CAR_BOX.x + (CAR_BOX.w - w) / 2, y = CAR_BOX.y + CAR_BOX.h - h;

            img.setAttribute('href', car.image);
            img.style.transformBox = 'fill-box';
            img.style.transformOrigin = 'center';
            img.style.transform = car.mirror ? 'scaleX(-1)' : '';
            img.style.display = '';
            $('carBuiltin').style.display = 'none';
            scene.classList.add('photo');

            // Ladeanschluss in Prozent des angezeigten Bildes
            const px = x + w * car.px / 100, py = y + h * car.py / 100;
            placeScene(px, py, x + w / 2 - 20, Math.max(3, y + h * 0.12 - 15));
        };
        probe.src = car.image;
    }

    function placeScene(px, py, bx, by) {
        const d = 'M21 60 C 21 ' + (py + 24).toFixed(1) + ', ' + (px - 30).toFixed(1) + ' ' + (py + 22).toFixed(1) + ', '
                + px.toFixed(1) + ' ' + py.toFixed(1);
        $('cable').setAttribute('d', d);
        $('flow').setAttribute('d', d);
        $('plug').setAttribute('cx', px.toFixed(1));
        $('plug').setAttribute('cy', py.toFixed(1));
        $('battG').setAttribute('transform', 'translate(' + bx.toFixed(1) + ' ' + by.toFixed(1) + ')');
    }

    // Easee meldet ohne Begrenzung den Hardware-Maximalwert (z. B. 32 A) → "max"
    function showLimit(value) {
        const isMax = value >= state.limitMax;
        $('limit').textContent = value <= 0 ? '–' : (isMax ? 'max' : value + ' A');
        $('minus').disabled = value > 0 && value <= 6;
        $('plus').disabled = isMax;
    }

    // Knopf bis zur Antwort sperren; kommt keine (z. B. Befehl ohne sichtbare Änderung), nach 20 s wieder freigeben
    let toggleTimer = null;

    function toggleCharging() {
        if (!state) return;
        $('toggle').disabled = true;
        clearTimeout(toggleTimer);
        toggleTimer = setTimeout(() => { if (state) $('toggle').disabled = !state.connected; }, 20000);
        requestAction('ChargingActive', !state.charging);
    }

    // Mehrere Klicks sammeln und erst nach kurzer Pause senden
    let limitTimer = null;

    function changeLimit(step) {
        if (!state || state.limit <= 0) return;
        const value = Math.max(6, Math.min(state.limitMax, Math.min(state.limit, state.limitMax) + step));
        state.limit = value;
        showLimit(value);

        clearTimeout(limitTimer);
        limitTimer = setTimeout(() => requestAction('ChargeLimit', value), 1000);
    }
</script>
